name = "dhole-dev"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

# Public, non-secret configuration. The Stripe key is NOT here -- set it with:
#   npx wrangler pages secret put STRIPE_SECRET_KEY
[vars]
SITE_URL = "https://dhole.dev"

# Comma-separated ISO country codes you are willing to ship to.
SHIP_TO_COUNTRIES = "US"

# Leave "false" until Stripe Tax is configured (origin address plus tax
# registrations). Turning it on before that makes Stripe reject every session.
ENABLE_AUTOMATIC_TAX = "false"
