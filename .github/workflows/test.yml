# npm test on every push and pull request (spec §16). Make this check
# required on main (Settings, Branches), so a red suite can't be merged.
#
# The latest Node 22. node:sqlite (the D1 stand-in the store tests run on)
# works without a flag from 22.13, so no NODE_OPTIONS is needed; an
# experimental flag there could stop a future Node from starting at all.
#
# check:layout isn't run here: it needs a browser (Playwright). Run it
# locally before merging (CLAUDE.md, Testing).

name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
