<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Link-preview card for the portfolio</title>
<!--
  Not a page. scripts/render-brand.mjs (npm run render:brand, and npm run
  sync:owner after it) loads this over HTTP at 1200x630, fills the two
  data-slot elements from data/owner.js, and screenshots it to
  assets/brand/og-portfolio.png, the card link previews show for /portfolio
  and /case. The text below is the copy for when OWNER.fullName is null.
  Nothing links here, and robots.txt disallows /scripts/.
-->
<link rel="stylesheet" href="/assets/site.css">
<style>
  /* site.css's Public Sans, with font-display: block instead of optional, so
     the render waits for the face rather than settling on the fallback.
     Same file and range; declared after site.css, so this face is the one used. */
  @font-face {
    font-family: "Public Sans";
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
    src: url("/assets/fonts/public-sans-latin-wght-normal.woff2") format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  /* Grey ground, so the card stands apart from white chat windows. */
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; background: var(--sweep); }
  .card {
    display: grid;
    grid-template-rows: auto 1fr auto;
    width: 1200px;
    height: 630px;
    padding: 72px 80px;
    color: var(--ink);
  }
  .card-site { font-size: 36px; font-weight: 600; line-height: 1.2; }
  .card-headline {
    align-self: center;
    max-width: 1040px;
    font-size: 68px;
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .card-sub { max-width: 1040px; font-size: 32px; font-weight: 400; line-height: 1.3; color: var(--graphite); }
</style>
</head>
<body>
<main class="card">
  <p class="card-site">dhole.dev/portfolio</p>
  <h1 class="card-headline" data-slot="headline">Product case studies</h1>
  <p class="card-sub" data-slot="sub">By a senior product manager, from things I've built on my own time.</p>
</main>
</body>
</html>
