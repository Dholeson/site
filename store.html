<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store — retro consoles and accessories | dhole.dev</title>
  <meta name="description" content="Tested and refurbished retro game consoles, controllers, and accessories." />
  <link rel="stylesheet" href="/assets/site.css" />
  <link rel="stylesheet" href="/assets/pages.css" />
  <script type="module" src="/assets/entry/store.js"></script>
</head>
<body>
  <section class="demo-header">
    <div class="wrap">
      <p class="eyebrow">Store</p>
      <h1>Consoles that were tested before they were listed</h1>
      <p class="lede">
        Everything is opened, cleaned, and boot-checked first. Controller sticks are
        measured with the <a href="/projects/drift-tester.html">drift tester</a>, so
        "no drift" means a reading rather than a guess.
      </p>
    </div>
  </section>

  <main>
    <div class="wrap">
      <div class="filters">
        <label>Search
          <input type="search" id="filter-search" placeholder="N64, controller…" />
        </label>
        <label>Platform
          <select id="filter-platform"><option value="all">All platforms</option></select>
        </label>
        <label>Type
          <select id="filter-category">
            <option value="all">Everything</option>
            <option value="console">Consoles</option>
            <option value="accessory">Accessories</option>
          </select>
        </label>
        <label>Sort
          <select id="filter-sort">
            <option value="default">Featured</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="name">Name</option>
          </select>
        </label>
        <span class="result-count" id="result-count"></span>
      </div>

      <div class="grid" id="product-grid"></div>
    </div>
  </main>
</body>
</html>
